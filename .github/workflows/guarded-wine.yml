name: Guarded Windows file access
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guarded-wine.yml'
      - 'android/qualification/guarded_wine.py'
      - 'android/qualification/wine_storage_probe.c'
      - 'android/qualification/check_guarded_wine.py'
      - 'android/qualification/android_runtime_probe.py'
      - 'android/qualification/original_startup*'
      - 'android/qualification/check_original_startup.py'
      - 'android/qualification/x87_flags_fixture.c'
      - 'android/qualification/check_x87_flags.py'
      - 'native/client-bridge/**'
      - 'android/app/src/main/java/com/russianranger/fta/client/ClientGuardedWine.kt'
      - 'android/app/src/main/java/com/russianranger/fta/client/ClientWorkingView.kt'
      - 'android/app/src/main/java/com/russianranger/fta/client/ClientNativeProbe.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guarded-wine:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture compilers
        run: |
          sudo apt-get update -qq > "$RUNNER_TEMP/guarded-toolchain.log" 2>&1
          sudo apt-get install -y --no-install-recommends gcc make binutils gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 >> "$RUNNER_TEMP/guarded-toolchain.log" 2>&1
      - name: Recover pinned public inputs
        run: |
          mkdir "$RUNNER_TEMP/guarded-inputs" "$RUNNER_TEMP/guarded-fixtures"
          for name in client-runtime-arm64.tar.gz runtime-corresponding-sources.tar.gz; do
            curl -fLsS --max-time 300 --retry 2 "https://github.com/Russianranger/uo-android-launcher/releases/download/v0.2.0/$name" -o "$RUNNER_TEMP/guarded-inputs/$name"
          done
      - name: Qualify the guarded native tracer
        run: python3 tools/check_client_readonly.py --sources "$RUNNER_TEMP/guarded-inputs/runtime-corresponding-sources.tar.gz" --work "$RUNNER_TEMP/guarded-native" > "$RUNNER_TEMP/guarded-native-result.log" 2>&1
      - name: Compile both Windows architectures sequentially
        run: |
          i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror android/qualification/wine_storage_probe.c -o "$RUNNER_TEMP/guarded-fixtures/probe32.exe"
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror android/qualification/wine_storage_probe.c -o "$RUNNER_TEMP/guarded-fixtures/probe64.exe"
          cp android/qualification/guarded_wine.py "$RUNNER_TEMP/guarded-fixtures/"
          cp android/qualification/android_runtime_probe.py "$RUNNER_TEMP/guarded-fixtures/android_probe.py"
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror android/qualification/original_startup.c -o "$RUNNER_TEMP/guarded-fixtures/startup64.exe"
          i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror android/qualification/original_startup_fixture.c -o "$RUNNER_TEMP/guarded-fixtures/Wow.exe"
          mkdir "$RUNNER_TEMP/guarded-fixtures/Utils"
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror android/qualification/original_startup_fixture.c -o "$RUNNER_TEMP/guarded-fixtures/Utils/WarcraftXLHost.exe"
          cp android/qualification/original_startup.py "$RUNNER_TEMP/guarded-fixtures/"
          i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror android/qualification/x87_flags_fixture.c -o "$RUNNER_TEMP/guarded-fixtures/x87-flags.exe"
          cp android/qualification/check_x87_flags.py "$RUNNER_TEMP/guarded-fixtures/"
      - name: Qualify guarded Wine and rehash both source trees
        run: python3 android/qualification/check_guarded_wine.py --proot "$RUNNER_TEMP/guarded-native/proot-readonly" --loader "$RUNNER_TEMP/guarded-native/loader" --archive "$RUNNER_TEMP/guarded-inputs/client-runtime-arm64.tar.gz" --fixtures "$RUNNER_TEMP/guarded-fixtures" --work "$RUNNER_TEMP/guarded-wine" > "$RUNNER_TEMP/guarded-wine-result.log" 2>&1
      - name: Qualify original startup observer with synthetic client and host
        run: python3 android/qualification/check_original_startup.py --proot "$RUNNER_TEMP/guarded-native/proot-readonly" --loader "$RUNNER_TEMP/guarded-native/loader" --archive "$RUNNER_TEMP/guarded-inputs/client-runtime-arm64.tar.gz" --runtime "$RUNNER_TEMP/guarded-wine/runtime" --fixtures "$RUNNER_TEMP/guarded-fixtures" --work "$RUNNER_TEMP/original-startup" > "$RUNNER_TEMP/guarded-original-result.log" 2>&1
      - name: Compare x87 condition-code profiles with synthetic data
        run: python3 android/qualification/check_x87_flags.py --proot "$RUNNER_TEMP/guarded-native/proot-readonly" --loader "$RUNNER_TEMP/guarded-native/loader" --archive "$RUNNER_TEMP/guarded-inputs/client-runtime-arm64.tar.gz" --runtime "$RUNNER_TEMP/guarded-wine/runtime" --fixtures "$RUNNER_TEMP/guarded-fixtures" --prefix "$RUNNER_TEMP/original-startup/prefix" --work "$RUNNER_TEMP/x87-flags" > "$RUNNER_TEMP/guarded-x87-result.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guarded-wine-${{ github.sha }}
          path: |
            ${{ runner.temp }}/guarded-*-result.log
            ${{ runner.temp }}/guarded-native/build.log
            ${{ runner.temp }}/guarded-native/readonly-evidence.json
            ${{ runner.temp }}/guarded-wine/probe.log
            ${{ runner.temp }}/guarded-wine/evidence.json
            ${{ runner.temp }}/guarded-wine/source-observation.json
            ${{ runner.temp }}/original-startup/prefix.log
            ${{ runner.temp }}/original-startup/probe.log
            ${{ runner.temp }}/original-startup/fault.log
            ${{ runner.temp }}/original-startup/client-exit.log
            ${{ runner.temp }}/original-startup/host-exit.log
            ${{ runner.temp }}/original-startup/host-crash.log
            ${{ runner.temp }}/original-startup/session/fixture-trace.log
            ${{ runner.temp }}/original-startup/evidence.json
            ${{ runner.temp }}/x87-flags/*.log
            ${{ runner.temp }}/x87-flags/evidence.json
          retention-days: 14
