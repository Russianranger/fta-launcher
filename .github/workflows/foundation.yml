name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Archive and database safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public repository boundary
        run: python tools/check_repository.py
      - name: Test tooling with synthetic fixtures
        run: python -m unittest discover -s tests -v
      - name: Check client receipt qualification boundaries
        run: python -m unittest discover -s android/qualification -p 'test_*.py' -v
      - name: Test native process ownership
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pthread native/process-supervisor/process_owner.cpp native/process-supervisor/process_owner_test.cpp -o "$RUNNER_TEMP/fta-process-owner-test"
          "$RUNNER_TEMP/fta-process-owner-test"

  android:
    name: Android foundation APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Stage exact ARM64 database provider and notices
        run: python3 tools/stage_android_provider.py --fetch-apk "$RUNNER_TEMP/provider-source.apk" --output "$RUNNER_TEMP/fta-provider" > "$RUNNER_TEMP/provider-stage.json"
      - name: Derive exact public runtime extraction catalog
        run: |
          curl --fail --location --retry 2 --max-time 300 https://github.com/Russianranger/uo-android-launcher/releases/download/v0.2.0/client-runtime-arm64.tar.gz -o "$RUNNER_TEMP/client-runtime.tar.gz"
          python3 android/qualification/build_runtime_catalog.py --archive "$RUNNER_TEMP/client-runtime.tar.gz" --output "$RUNNER_TEMP/client-runtime-catalog.tsv"
      - name: Install synthetic probe compilers
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq > "$RUNNER_TEMP/client-toolchain.log" 2>&1
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 >> "$RUNNER_TEMP/client-toolchain.log" 2>&1
      - name: Build owned client bridge and synthetic probes sequentially
        timeout-minutes: 10
        run: |
          curl -fLsS --retry 2 --max-time 300 https://github.com/Russianranger/uo-android-launcher/releases/download/v0.2.0/runtime-corresponding-sources.tar.gz -o "$RUNNER_TEMP/bridge-sources.tar.gz"
          curl -fLsS --retry 2 --max-time 300 https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o "$RUNNER_TEMP/android-ndk.zip"
          python3 tools/build_client_bridge.py --sources "$RUNNER_TEMP/bridge-sources.tar.gz" --ndk-zip "$RUNNER_TEMP/android-ndk.zip" --work "$RUNNER_TEMP/client-bridge-build" > "$RUNNER_TEMP/client-bridge-build.log" 2>&1
          python3 tools/stage_client_probe.py --bridge-build "$RUNNER_TEMP/client-bridge-build" --provider "$RUNNER_TEMP/fta-provider" --companion "$RUNNER_TEMP/FTA-client-bridge-corresponding-source.zip"
      - name: Preserve failed public toolchain diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: client-toolchain-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/client-toolchain.log
            ${{ runner.temp }}/client-bridge-build.log
            ${{ runner.temp }}/client-bridge-build/build.log
          retention-days: 14
          if-no-files-found: warn
      - name: Test, lint and compile foundation
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 -PftaProviderDir="$RUNNER_TEMP/fta-provider" -PftaClientRuntimeCatalog="$RUNNER_TEMP/client-runtime-catalog.tsv" testDebugUnitTest lintDebug assembleDebug
      - name: Summarize measured Android unit results
        working-directory: android
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert reports, 'Android JUnit reports are missing'
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in reports:
              suite = ET.parse(path).getroot()
              assert int(suite.attrib['tests']) == len(suite.findall('testcase'))
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))
          print(json.dumps(dict(androidUnitResults=totals, suites=len(reports)), sort_keys=True))
          assert totals['failures'] == totals['errors'] == 0
          PYTHON
      - name: Check game-data cache helper and host JNI
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          cache = pathlib.Path(os.environ.get('GRADLE_USER_HOME', str(pathlib.Path.home() / '.gradle')))
          stdlib = next(cache.rglob('kotlin-stdlib-2.0.21.jar'))
          cp = 'android/app/build/tmp/kotlin-classes/debug:' + str(stdlib)
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          subprocess.run(['python3', 'tools/check_game_data_cache.py', '--kotlin-classpath', cp,
                          '--jdk', os.environ['JAVA_HOME'], '--library-dir', str(temporary / 'fta-cache-helper'),
                          '--output', str(temporary / 'fta-cache-evidence.json')], check=True)
          PYTHON
      - name: Install and fully reverify public runtime with 96 MiB JVM heap
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          cache = pathlib.Path(os.environ.get('GRADLE_USER_HOME', str(pathlib.Path.home() / '.gradle')))
          stdlib = next(cache.rglob('kotlin-stdlib-2.0.21.jar'))
          cp = 'android/app/build/tmp/kotlin-classes/debug:android/app/build/tmp/kotlin-classes/debugUnitTest:' + str(stdlib)
          pin = json.loads(pathlib.Path('android/qualification/client-runtime-lock.json').read_text())
          subprocess.run(['java', '-Xmx96m', '-cp', cp, 'com.russianranger.fta.client.RuntimeStoreQualification',
                          str(temporary / 'client-runtime-catalog.tsv'), str(temporary / 'client-runtime.tar.gz'),
                          str(temporary / 'installed-client-runtime'), pin['catalog']['sha256']], check=True)
          PYTHON
      - name: Record exact APK digest
        working-directory: android/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Verify packaged native bytes and legal files
        run: python3 tools/verify_android_apk.py android/app/build/outputs/apk/debug/app-debug.apk --provider-stage "$RUNNER_TEMP/fta-provider"
      - uses: actions/upload-artifact@v4
        with:
          name: fta-foundation-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fta-client-bridge-source-${{ github.sha }}
          path: ${{ runner.temp }}/FTA-client-bridge-corresponding-source.zip
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Direct APK download
    needs: [tooling, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fta-foundation-debug-${{ github.sha }}
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: fta-client-bridge-source-${{ github.sha }}
          path: apk
      - name: Publish checked development APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd apk
          sha256sum -c app-debug.apk.sha256
          mv app-debug.apk FTA-Launcher-development.apk
          sha256sum FTA-Launcher-development.apk > FTA-Launcher-development.apk.sha256
          cat > release-notes.txt <<'NOTES'
          Development snapshot of the From the Ashes Android launcher.

          Download the APK directly from this release. See the repository README for the exact features and remaining runtime gates. This is a debug build, not a gameplay-qualified beta. No database seed, accounts, client or game assets are bundled.

          Python safety tests, Android unit tests, lint and APK compilation passed for this commit. Physical Thor runtime validation is separate.
          NOTES
          FTA_TAG="development-${GITHUB_SHA:0:12}"
          if gh release view "$FTA_TAG" >/dev/null 2>&1; then
            echo 'This commit already has a download release.'
          else
            gh release create "$FTA_TAG" FTA-Launcher-development.apk FTA-Launcher-development.apk.sha256 FTA-client-bridge-corresponding-source.zip --target "$GITHUB_SHA" --prerelease --title 'FTA Launcher development snapshot' --notes-file release-notes.txt
          fi
