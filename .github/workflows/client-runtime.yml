name: Synthetic mixed Wine runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-runtime.yml'
      - 'android/qualification/client-runtime-lock.json'
      - 'android/qualification/check_client_runtime.py'
      - 'android/qualification/runtime_probe.c'
      - 'android/qualification/run_client_runtime.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixed-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture cross-compilers
        run: |
          sudo apt-get update -qq > "$RUNNER_TEMP/fixture-toolchain.log" 2>&1
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 >> "$RUNNER_TEMP/fixture-toolchain.log" 2>&1
      - name: Recover and audit pinned public runtime
        run: |
          mkdir "$RUNNER_TEMP/fta-runtime-inputs" "$RUNNER_TEMP/fta-runtime-evidence"
          for name in client-runtime-arm64.tar.gz client-runtime-manifest.json; do
            curl -fLsS --max-time 300 --retry 2 "https://github.com/Russianranger/uo-android-launcher/releases/download/v0.2.0/$name" -o "$RUNNER_TEMP/fta-runtime-inputs/$name"
          done
          python3 android/qualification/check_client_runtime.py --archive "$RUNNER_TEMP/fta-runtime-inputs/client-runtime-arm64.tar.gz" --manifest "$RUNNER_TEMP/fta-runtime-inputs/client-runtime-manifest.json" --output "$RUNNER_TEMP/fta-runtime-evidence/runtime-audit.json"
      - name: Compile two synthetic Windows architectures sequentially
        run: |
          mkdir "$RUNNER_TEMP/fta-probe"
          i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror android/qualification/runtime_probe.c -o "$RUNNER_TEMP/fta-probe/probe32.exe" > "$RUNNER_TEMP/fta-runtime-evidence/compile-x86.log" 2>&1
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror android/qualification/runtime_probe.c -o "$RUNNER_TEMP/fta-probe/probe64.exe" > "$RUNNER_TEMP/fta-runtime-evidence/compile-x64.log" 2>&1
          sha256sum "$RUNNER_TEMP/fta-probe/"*.exe > "$RUNNER_TEMP/fta-runtime-evidence/fixture-sha256.txt"
      - name: Qualify mixed process creation, IPC and owner loss on native ARM64
        run: |
          test "$(uname -m)" = aarch64
          FTA_ROOT="$RUNNER_TEMP/fta-runtime-root"
          mkdir "$FTA_ROOT"
          tar --no-same-owner --no-same-permissions -xzf "$RUNNER_TEMP/fta-runtime-inputs/client-runtime-arm64.tar.gz" -C "$FTA_ROOT"
          mkdir -p "$FTA_ROOT/probe" "$FTA_ROOT/dev" "$FTA_ROOT/proc" "$FTA_ROOT/sys"
          cp "$RUNNER_TEMP/fta-probe/"*.exe "$FTA_ROOT/probe/"
          cp android/qualification/run_client_runtime.sh "$FTA_ROOT/probe/run.sh"
          cleanup() {
            result=$?
            trap - EXIT
            sudo cp -a "$FTA_ROOT/probe/logs" "$RUNNER_TEMP/fta-runtime-evidence/" 2>/dev/null || true
            sudo umount "$FTA_ROOT/sys" 2>/dev/null || true
            sudo umount "$FTA_ROOT/proc" 2>/dev/null || true
            sudo umount "$FTA_ROOT/dev" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          sudo mount --bind /dev "$FTA_ROOT/dev"
          sudo mount --bind /proc "$FTA_ROOT/proc"
          # Wine derives processor topology/SMBIOS from sysfs before FEX reads
          # the corresponding CPU registry keys. Expose real data read-only.
          sudo mount --bind /sys "$FTA_ROOT/sys"
          sudo mount -o remount,bind,ro "$FTA_ROOT/sys"
          sudo timeout --kill-after=45 600 chroot "$FTA_ROOT" /usr/bin/env -i /bin/sh /probe/run.sh > "$RUNNER_TEMP/fta-runtime-evidence/runtime-result.log" 2>&1
          cat "$RUNNER_TEMP/fta-runtime-evidence/runtime-result.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-wine-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/fta-runtime-evidence/
          retention-days: 14
          if-no-files-found: warn
